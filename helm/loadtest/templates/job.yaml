apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-{{ .Values.runId | trunc 20 | trimSuffix "-" }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  {{- if gt (int .Values.agentCount) 1 }}
  completions: {{ int .Values.agentCount }}
  parallelism: {{ int .Values.agentCount }}
  completionMode: Indexed
  {{- end }}
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Keep the container ALIVE after k6 exits (a short grace window):
          # kubectl cp cannot reach a terminated container, so the results
          # snapshot must happen while the pod still runs. k6 writes its final
          # summary and flushes the JSON stream on exit; the sleep then gives
          # the collector a full window to copy the COMPLETE file once, instead
          # of racing k6's buffered writes mid-run (the old approach lost ~12%
          # of datapoints). k6's exit code is preserved as the pod's outcome.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set +e
              k6 run --out json=/out/k6.json /scripts/token-exchange.js
              k6_exit=$?
              echo "k6 exited with code ${k6_exit}; holding pod for result collection"
              sleep "${COLLECT_GRACE_SECONDS:-120}"
              exit ${k6_exit}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            - name: AGENT_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: AGENT_COUNT
              value: {{ int .Values.agentCount | quote }}
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: results
              mountPath: /out
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: script
          configMap:
            name: {{ .Release.Name }}-script
        - name: results
          emptyDir: {}
{{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
{{- end }}
